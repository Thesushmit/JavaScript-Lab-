<body>
    <h1>Task1 Write a function declaration that takes two numbers and returns the greater
number.</h1>
<script>
    function greater(a,b) {
        if (a>b){
            return a;
        }
        else{
            return b;
        }
    }
    console.log(greater(4,5))
</script>
