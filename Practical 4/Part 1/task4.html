<h1>Create a closure that stores a secret message and returns it only when a password matches.</h1>
<script>
function secretMessageClosure(secret, password) {
    return function(pass) {
        if (pass === password) {
            return secret;
        } else {
            return "Incorrect password!";
        }
    }
}


const getSecret = secretMessageClosure("This is a secret message.", "1234");



console.log(getSecret("1234")); 
</script>
