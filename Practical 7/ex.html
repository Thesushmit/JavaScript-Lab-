<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Quiz</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .question { margin-bottom: 20px; padding: 10px; border: 1px solid #ddd; border-radius: 6px; }
    button { padding: 8px 12px; margin-top: 10px; cursor: pointer; }
    #timer { font-weight: bold; color: darkred; margin-bottom: 15px; }
  </style>
</head>
<body>
  <h1>Dynamic Quiz</h1>
  <div id="timer">Time Left: 30s</div>
  <div id="quiz"></div>
  <button id="submit">Submit</button>
  <div id="result"></div>

  <script>
    // 1. Questions stored in JSON array
    const questions = [
      {
        question: "Which keyword declares a variable in JavaScript?",
        options: ["var", "let", "const", "All of these"],
        answer: 3
      },
      {
        question: "Which method adds an element to the end of an array?",
        options: ["push()", "pop()", "shift()", "concat()"],
        answer: 0
      },
      {
        question: "Which function runs repeatedly at a set time interval?",
        options: ["setTimeout", "setInterval", "clearInterval", "repeat()"],
        answer: 1
      }
    ];

    const quizContainer = document.getElementById('quiz');
    const resultContainer = document.getElementById('result');
    const submitBtn = document.getElementById('submit');
    const timerDisplay = document.getElementById('timer');

    let userAnswers = [];
    let timeLeft = 30; // seconds
    let timer;

    // 2. Dynamically create question elements
    function buildQuiz() {
      questions.forEach((q, index) => {
        const questionDiv = document.createElement('div');
        questionDiv.className = 'question';

        const questionTitle = document.createElement('h3');
        questionTitle.textContent = `${index + 1}. ${q.question}`;
        questionDiv.appendChild(questionTitle);

        q.options.forEach((option, i) => {
          const label = document.createElement('label');
          label.style.display = 'block';
          const input = document.createElement('input');
          input.type = 'radio';
          input.name = `question${index}`;
          input.value = i;
          input.addEventListener('change', () => {
            userAnswers[index] = parseInt(input.value);
          });
          label.appendChild(input);
          label.appendChild(document.createTextNode(option));
          questionDiv.appendChild(label);
        });

        quizContainer.appendChild(questionDiv);
      });
    }

    // 3. Calculate and display score
    function showResults() {
      clearInterval(timer);
      let score = 0;
      questions.forEach((q, index) => {
        if (userAnswers[index] === q.answer) score++;
      });
      resultContainer.textContent = `Your Score: ${score}/${questions.length}`;
      submitBtn.disabled = true;
    }

    // 4. Timer
    function startTimer() {
      timer = setInterval(() => {
        timeLeft--;
        timerDisplay.textContent = `Time Left: ${timeLeft}s`;
        if (timeLeft <= 0) {
          timerDisplay.textContent = "Time's up!";
          showResults();
        }
      }, 1000);
    }

    submitBtn.addEventListener('click', showResults);

    // Initialize quiz
    buildQuiz();
    startTimer();
  </script>
</body>
</html>
