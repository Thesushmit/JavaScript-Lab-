<!DOCTYPE html>
<html>
<head>
    <title>Student Ages Array Operations</title>
</head>
<body>
    <h2>Student Ages Array Operations</h2>
  
    <script>
        let ages = [18, 19, 20, 21, 22];

        ages.push(23);
        ages.pop();

        

        let doubleAges = ages.map(age => age * 2);
       
        let cubeAges = ages.map(age => age ** 3);
        

        
        console.log("Array after push and pop:", ages);
        console.log("Length of array:", ages.length);
        console.log("Double of each age:", doubleAges);
        console.log("Cube of each age:", cubeAges);
    </script>
</body>
