<body>
    <h1>Write a function expression that calculates the factorial of a number.</h1>
    <script>
        const factorial = function factorial(a){
            return a <= 1 ? 1 : a * factorial(a-1);
        }
        console.log(factorial(5));
    </script>
</body>
