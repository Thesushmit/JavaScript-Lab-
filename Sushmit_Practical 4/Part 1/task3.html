<!DOCTYPE html>

<body>
    <h1>Write an arrow function that checks if a given string contains the word
&quot;JavaScript&quot;.</h1>
<script>
    const isjs = (a) => {
        if (a.includes("JavaScript")) {
            console.log("True");
        } else {
            console.log("False");
        }
    };
    isjs("hey");
    isjs("I love JavaScript!");
</script>

</body>
</html>
