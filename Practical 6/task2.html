        function checkstartwith(){
            let str = prompt("Enter String to check the char start with S");
            let regx = /^S/;
            console.log(str);
            console.log("String Start with S: "+regx.test(str));
        }
        // checkstartwith();
        function checkendwith() {

        let mobileRegex = /^[6-9]\d{9}$/;
        let validMobile = "9876543210";
        let invalidMobile = "1234567890";
        console.log("Valid Mobile:", mobileRegex.test(validMobile));
        console.log("Invalid Mobile:", mobileRegex.test(invalidMobile));

        let dateText = "Today's date is 12/09/2025 and tomorrow will be 13/09/2025.";
        let dateRegex = /\d{2}\/\d{2}\/\d{4}/g;
        console.log("Extracted Dates:", dateText.match(dateRegex));

        let passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;
        let strongPassword = "StrongPass1!";
        let weakPassword = "weakpass";
        console.log("Strong Password:", passwordRegex.test(strongPassword));
        console.log("Weak Password:", passwordRegex.test(weakPassword));

        let text = "This is is a test test";
        let dupRegex = /\b(\w+)\s+\1\b/g;
        let duplicates = [];
        let match;
        while ((match = dupRegex.exec(text)) !== null) {
            duplicates.push(match[1]);
        }
        console.log("Duplicate Words:", duplicates);
